
<!DOCTYPE html>
<html>
<head><title>Dashboard</title></head>
<body>
  <h2>Welcome {{ session['username'] }}</h2>
  <form method="POST">
    Date: <input type="date" name="date" required>
    Start Time: <input type="time" name="start" required>
    End Time: <input type="time" name="end" required>
    Task: <input type="text" name="task" required>
    <button type="submit">Log Hours</button>
  </form>
  <h3>Total Hours: {{ total_hours }}</h3>
  <table border="1">
    <tr><th>Date</th><th>Start</th><th>End</th><th>Task</th><th>Hours</th></tr>
    {% for log in logs %}
    <tr><td>{{ log[0] }}</td><td>{{ log[1] }}</td><td>{{ log[2] }}</td><td>{{ log[3] }}</td><td>{{ log[4] }}</td></tr>
    {% endfor %}
  </table>
  <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
